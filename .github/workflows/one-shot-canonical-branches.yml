name: One-shot canonical branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Canonicalize branches everywhere'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize branch code paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
                  return False
              p.write_text(s.replace(old,new))
              return True

          # Backend: only three canonical productions and canonicalize login/PIN requests.
          replace('server/server.js',
              'function branchKey(s){ const key=normalize(s); return key==="нуркена"?"нуркен":key; }',
              'function branchKey(s){ const key=normalize(s); return key==="нуркен"||key==="нуркена"?"нуркена":key; }\nfunction canonicalBranch(s){ const key=branchKey(s); return key==="горняк"?"Горняк":key==="лободы"?"Лободы":key==="нуркена"?"Нуркена":""; }')
          old='''function branchesFromDb(db){
            const fixed=["Лободы","Нуркена","Горняк","Пришахтинск","Сарань","Ермекова","Анжерская"];
            const extra=ensureArray(db.suppliers).flatMap(s=>ensureArray(s.schedules).map(x=>String(x.branch||"").trim())).filter(Boolean);
            const out=[],seen=new Set();
            for(const branch of [...fixed,...extra]){
              const key=branchKey(branch);
              if(!key||seen.has(key))continue;
              seen.add(key);out.push(branch);
            }
            return out;
          }'''
          replace('server/server.js',old,'function branchesFromDb(){ return ["Горняк","Лободы","Нуркена"]; }')
          p=Path('server/server.js'); s=p.read_text()
          needle='const branch=String(body.branch||"").trim(),pin=String(body.pin||"");'
          count=s.count(needle)
          if count < 2: raise SystemExit(f'expected at least two branch+pin request sites, got {count}')
          s=s.replace(needle,'const branch=canonicalBranch(body.branch),pin=String(body.pin||"");')
          p.write_text(s)

          # Admin supplier schedules: display/save only the three canonical names.
          replace('docs/admin-ui-overhaul.js',
              'const PO_BRANCHES=["ГОРНЯК","ЛОБОДЫ","НУРКЕН","САРАНЬ","ПРИШАХТИНСК"];',
              'const PO_BRANCHES=["Горняк","Лободы","Нуркена"];')
          replace('docs/admin-ui-overhaul.js',
              'const PO_BRANCH_LABELS={"ГОРНЯК":"Горняк","ЛОБОДЫ":"Лободы","НУРКЕН":"Нуркен","НУРКЕНА":"Нуркен","САРАНЬ":"Сарань","ПРИШАХТИНСК":"Пришахтинск"};',
              'const PO_BRANCH_LABELS={"ГОРНЯК":"Горняк","ЛОБОДЫ":"Лободы","НУРКЕН":"Нуркена","НУРКЕНА":"Нуркена"};')
          replace('docs/admin-ui-overhaul.js',
              'const branchKey=value=>{const key=normalize(value);return key==="нуркена"?"нуркен":key};',
              'const branchKey=value=>{const key=normalize(value);return key==="нуркен"||key==="нуркена"?"нуркена":key};\n  const canonicalBranch=value=>{const key=branchKey(value);return key==="горняк"?"Горняк":key==="лободы"?"Лободы":key==="нуркена"?"Нуркена":""};')
          replace('docs/admin-ui-overhaul.js',
              '''      const branch=card.querySelector('[data-key="branch"]')?.value.trim()||"";
              const days=key=>[...card.querySelectorAll(`.po-day-picker[data-key="${key}"] .po-day.active`)].map(x=>x.dataset.day).join(", ");
              const order=days("order"),delivery=days("delivery"),note=card.querySelector('[data-key="note"]')?.value.trim()||"";
              if(!branch)throw new Error("Укажите название филиала.");''',
              '''      const rawBranch=card.querySelector('[data-key="branch"]')?.value.trim()||"";
              const days=key=>[...card.querySelectorAll(`.po-day-picker[data-key="${key}"] .po-day.active`)].map(x=>x.dataset.day).join(", ");
              const order=days("order"),delivery=days("delivery"),note=card.querySelector('[data-key="note"]')?.value.trim()||"";
              if(!rawBranch)throw new Error("Укажите название филиала.");
              const branch=canonicalBranch(rawBranch);
              if(!branch)throw new Error("Допустимы только филиалы: Горняк, Лободы, Нуркена.");''')
          replace('docs/admin-ui-overhaul.js',
              'const custom=(supplier.schedules||[]).filter(r=>!PO_BRANCHES.some(b=>branchKey(b)===branchKey(r.branch))).map(r=>scheduleCard(r.branch,r,{editableBranch:true,enabled:true}));',
              'const custom=[];')
          replace('docs/admin-ui-overhaul.js',
              '\n      <button class="secondary" onclick="addScheduleField()">＋ Другой филиал</button>',
              '', required=False)

          # Static pages: remove legacy production choices and normalize option values/text.
          for p in Path('docs').glob('*.html'):
              s=p.read_text()
              s=re.sub(r'<option([^>]*)>\s*(?:Пришахтинск|ПРИШАХТИНСК|Сарань|САРАНЬ|Ермекова|ЕРМЕКОВА|Анжерская|АНЖЕРСКАЯ)\s*</option>','',s)
              for old,new in [('ГОРНЯК','Горняк'),('ЛОБОДЫ','Лободы'),('НУРКЕНА','Нуркена'),('НУРКЕН','Нуркена')]:
                  s=s.replace(f'value="{old}"',f'value="{new}"')
                  s=re.sub(rf'(<option[^>]*>)\s*{old}\s*(</option>)',rf'\1{new}\2',s)
              s=re.sub(r'(<option[^>]*>)\s*Нуркен\s*(</option>)',r'\1Нуркена\2',s)
              p.write_text(s)

          # Cache-bust the branch-related JS so browsers cannot keep old branch rules.
          p=Path('docs/config.js'); s=p.read_text()
          s=re.sub(r'admin-ui-overhaul\.js\?v=[^"\']+', 'admin-ui-overhaul.js?v=20261016-4', s)
          s=re.sub(r'admin-offer-status-fix\.js\?v=[^"\']+', 'admin-offer-status-fix.js?v=20261016-2', s)
          s=re.sub(r'branch-display\.js\?v=[^"\']+', 'branch-display.js?v=20261016-3', s)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "Alexandr"
          git config user.email "blacknode305@gmail.com"
          git add server/server.js docs/admin-ui-overhaul.js docs/*.html docs/config.js
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Canonicalize branches everywhere"
          git push
