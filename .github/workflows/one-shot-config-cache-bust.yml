name: One-shot config cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache-bust config.js in Pages HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          version = '20261016-restore1'
          changed = []
          for p in Path('docs').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              n = re.sub(r'src=(["\'])config\.js(?:\?v=[^"\']*)?\1', f'src="config.js?v={version}"', s)
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))
          print('changed:', ', '.join(changed) or 'none')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/*.html
          git commit -m 'Cache-bust config.js after Railway domain restore'
          git push
