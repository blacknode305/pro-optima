name: Patch excluded products in forms

on:
  push:
    branches: [fix/excluded-products-form]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix excluded products in branch forms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exclusion handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=None):
              p=Path(path)
              s=p.read_text()
              actual=s.count(old)
              if actual == 0:
                  raise SystemExit(f'missing expected text in {path}: {old[:140]!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'unexpected replacement count in {path}: expected {count}, got {actual}: {old[:140]!r}')
              p.write_text(s.replace(old,new))

          # Backend: all branch aliases must compare canonically, not only Nurken/Nurkena.
          rep('server/server.js',
              'function sameBranch(a,b){return branchKey(a)===branchKey(b)}',
              'function sameBranch(a,b){return normalize(canonicalBranch(a))===normalize(canonicalBranch(b))}',
              1)

          # Backend: never trust stale client item lists. Re-check submitted items against the current plan.
          old='''function sanitizeOrderItems(items){
            return ensureArray(items).map(x=>({
              productId:Number(x.productId)||null,
              product:String(x.product||x.name||"").trim(),
              used:x.used!==false,
              stock:sanitizeQty(x.stock),
              stockUnit:String(x.stockUnit||x.unit||"").trim(),
              expected:sanitizeQty(x.expected ?? x.order),
              unit:String(x.unit||"").trim(),
              confirmed:x.confirmed===undefined?undefined:sanitizeQty(x.confirmed),
              delivered:x.delivered===undefined?null:sanitizeQty(x.delivered),
              deliveredUnit:String(x.deliveredUnit||x.unit||"").trim(),
              note:String(x.note||"").trim()
            })).filter(x=>x.product);
          }'''
          new=old+'''\nfunction filterOrderItemsToPlan(items,plan){
            const allowedItems=ensureArray(plan?.items);
            const allowedIds=new Set(allowedItems.map(x=>Number(x.productId)).filter(x=>Number.isFinite(x)&&x>0));
            const allowedNames=new Set(allowedItems.map(x=>normalize(x.name)).filter(Boolean));
            return sanitizeOrderItems(items).filter(item=>{
              const id=Number(item.productId);
              return (Number.isFinite(id)&&id>0&&allowedIds.has(id))||allowedNames.has(normalize(item.product));
            });
          }'''
          rep('server/server.js',old,new,1)
          rep('server/server.js',
              '''        const plan=allowedPlan.find(x=>String(x.supplierId)===String(supplier.id));
                  const items=sanitizeOrderItems(body.items);''',
              '''        const plan=allowedPlan.find(x=>String(x.supplierId)===String(supplier.id));
                  const items=filterOrderItemsToPlan(body.items,plan);''',
              1)

          # Admin: normalize branch aliases everywhere exclusions are displayed/edited.
          old='''function allBranches(){
            return [...new Set(db.flatMap(s=>s.schedules.map(r=>r.branch)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));
          }'''
          new='''function branchCompareKey(value){
            const key=normalize(value);
            if(key==="нуркен"||key==="нуркена")return "нуркена";
            if(key==="анжерского"||key==="анжерская")return "анжерская";
            return key;
          }
          function canonicalBranchName(value){
            const key=branchCompareKey(value);
            const map={"горняк":"Горняк","лободы":"Лободы","нуркена":"Нуркена","сарань":"Сарань","пришахтинск":"Пришахтинск","ермекова":"Ермекова","анжерская":"Анжерская"};
            return map[key]||String(value??"").trim();
          }
          function sameBranchName(a,b){return branchCompareKey(a)===branchCompareKey(b)}
          function allBranches(){
            const fixed=["Горняк","Лободы","Нуркена","Пришахтинск","Сарань","Ермекова","Анжерская"];
            const extra=db.flatMap(s=>(s.schedules||[]).map(r=>r.branch)).filter(Boolean);
            const out=[],seen=new Set();
            for(const raw of [...fixed,...extra]){
              const name=canonicalBranchName(raw),key=branchCompareKey(name);
              if(!key||seen.has(key))continue;
              seen.add(key);out.push(name);
            }
            return out.sort((a,b)=>a.localeCompare(b,"ru"));
          }'''
          rep('docs/admin.html',old,new,1)

          rep('docs/admin.html',
              '''${allBranches().map(b=>`<label><input type="checkbox" class="edit-product-excluded" value="${esc(b)}" ${(p.excludedBranches||[]).includes(b)?"checked":""}> ${esc(b)}</label>`).join("")}''',
              '''${allBranches().map(b=>`<label><input type="checkbox" class="edit-product-excluded" value="${esc(b)}" ${(p.excludedBranches||[]).some(x=>sameBranchName(x,b))?"checked":""}> ${esc(b)}</label>`).join("")}''',
              1)

          rep('docs/admin.html',
              '''function branchUsageText(p){
            const ex=Array.isArray(p.excludedBranches)?p.excludedBranches:[];
            if(!ex.length)return "Используется на всех производствах";
            return "Не используется: "+ex.join(", ");
          }
          function productUsedOnBranch(p,branch){
            return p&&p.catalogStatus!=="proposal"&&!(p.excludedBranches||[]).includes(branch);
          }''',
              '''function branchUsageText(p){
            const ex=[];
            for(const raw of Array.isArray(p.excludedBranches)?p.excludedBranches:[]){
              const name=canonicalBranchName(raw);
              if(name&&!ex.some(x=>sameBranchName(x,name)))ex.push(name);
            }
            if(!ex.length)return "Используется на всех производствах";
            return "Не используется: "+ex.join(", ");
          }
          function productUsedOnBranch(p,branch){
            return p&&p.catalogStatus!=="proposal"&&!(p.excludedBranches||[]).some(x=>sameBranchName(x,branch));
          }''',
              1)

          rep('docs/admin.html',
              'const branches=["ГОРНЯК","ЛОБОДЫ","НУРКЕН","САРАНЬ","ПРИШАХТИНСК"];',
              'const branches=allBranches();',
              1)
          rep('docs/admin.html',
              'p.excludedBranches=branches.filter(b=>b!==branch);',
              'p.excludedBranches=branches.filter(b=>!sameBranchName(b,branch));',
              1)
          rep('docs/admin.html',
              'p.excludedBranches=(p.excludedBranches||[]).filter(b=>b!==branch);',
              'p.excludedBranches=(p.excludedBranches||[]).filter(b=>!sameBranchName(b,branch));',
              1)

          old='''function setProductBranchUsage(product,branch,used){
            const ex=new Set(Array.isArray(product.excludedBranches)?product.excludedBranches:[]);
            if(used)ex.delete(branch);else ex.add(branch);
            product.excludedBranches=[...ex];
          }'''
          new='''function setProductBranchUsage(product,branch,used){
            const next=(Array.isArray(product.excludedBranches)?product.excludedBranches:[])
              .filter(x=>!sameBranchName(x,branch))
              .map(canonicalBranchName);
            if(!used)next.push(canonicalBranchName(branch));
            product.excludedBranches=next.filter((value,index,array)=>value&&array.findIndex(x=>sameBranchName(x,value))===index);
          }'''
          rep('docs/admin.html',old,new,1)

          # Stock import comparisons should use the same aliases too.
          rep('docs/admin.html',
              'normalize(x.branch)===normalize(snap.branch)',
              'sameBranchName(x.branch,snap.branch)')
          PY

          node --check server/server.js
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "Alexandr"
          git config user.email "blacknode305@gmail.com"
          git add server/server.js docs/admin.html
          git diff --cached --check
          git commit -m "Fix excluded products in branch forms"
          git push
