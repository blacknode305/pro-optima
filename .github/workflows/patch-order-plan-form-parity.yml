name: Patch order plan form parity

on:
  push:
    branches: [fix/order-plan-form-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Match operator forms to admin order plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch backend assignment parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/server.js')
          s=p.read_text()

          old='''function offerFor(db,supplierId,productId,branch,unit){
            const rows=ensureArray(db.offers).filter(o=>
              String(o.supplierId)===String(supplierId)&&Number(o.productId)===Number(productId)&&
              (String(o.branch||"*")==="*"||sameBranch(o.branch,branch))
            );
            const same=rows.filter(o=>!unit||normalize(offerUnit(o))===normalize(unit));
            const pool=same.length?same:rows;
            const active=pool.filter(o=>manualSetting(o,branch)!==false);
            return (active.length?active:pool).sort((a,b)=>(hasPrice(a)?0:1)-(hasPrice(b)?0:1)||Number(a.price||Infinity)-Number(b.price||Infinity))[0]||null;
          }'''
          new='''function offerFor(db,supplierId,productId,branch,unit){
            // Keep operator forms in sync with the admin order planner:
            // one effective offer per supplier/product. A branch-specific row
            // overrides the wildcard row regardless of price, and a manually
            // disabled effective row means this supplier is not eligible.
            const rows=ensureArray(db.offers).filter(o=>
              String(o.supplierId)===String(supplierId)&&Number(o.productId)===Number(productId)&&
              (String(o.branch||"*")==="*"||sameBranch(o.branch,branch))
            );
            let effective=null;
            for(const row of rows){
              const specific=String(row.branch||"*")!=="*"&&sameBranch(row.branch,branch);
              if(!effective||specific)effective=row;
            }
            if(!effective||manualSetting(effective,branch)===false)return null;
            return effective;
          }'''
          if s.count(old)!=1:
              raise SystemExit(f'offerFor target count={s.count(old)}')
          s=s.replace(old,new)

          old2='''return {supplierId:s.id,supplier:s,link,o,orderUnit:unit,priority:Number.isFinite(Number(link.priority))?Number(link.priority):i};'''
          new2='''return {supplierId:s.id,supplier:s,link,o,orderUnit:unit,priority:Number(link.priority)||0};'''
          if s.count(old2)!=1:
              raise SystemExit(f'priority target count={s.count(old2)}')
          s=s.replace(old2,new2)

          p.write_text(s)
          PY

          node --check server/server.js
          npm run check
          git diff --check

          # Static regression assertions for the two parity rules.
          grep -F 'if(!effective||manualSetting(effective,branch)===false)return null;' server/server.js
          grep -F 'priority:Number(link.priority)||0' server/server.js

      - name: Commit patch
        run: |
          git config user.name "Alexandr"
          git config user.email "blacknode305@gmail.com"
          git add server/server.js
          git diff --cached --check
          git commit -m "Match operator forms to admin order plan"
          git push
