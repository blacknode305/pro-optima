name: Restore all branches code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore all branches and normalize casing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pre-restriction files and normalize casing
        run: |
          git checkout 54beef244af71b90ab0035cfb9a694aca35ff762 -- server/server.js docs/admin-ui-overhaul.js docs/config.js docs/form.html docs/operator.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing text in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new))

          # Backend: keep every original branch, normalize aliases before login/PIN storage.
          rep('server/server.js',
              'function branchKey(s){ const key=normalize(s); return key==="нуркена"?"нуркен":key; }',
              'function branchKey(s){ const key=normalize(s); return key==="нуркен"||key==="нуркена"?"нуркена":key; }\nfunction canonicalBranch(s){ const key=branchKey(s); const map={"горняк":"Горняк","лободы":"Лободы","нуркена":"Нуркена","сарань":"Сарань","пришахтинск":"Пришахтинск","ермекова":"Ермекова","анжерская":"Анжерская","анжерского":"Анжерская"}; return map[key]||String(s??"").trim(); }')
          p=Path('server/server.js'); s=p.read_text()
          needle='const branch=String(body.branch||"").trim(),pin=String(body.pin||"");'
          if s.count(needle)<2: raise SystemExit('expected login/access branch sites')
          s=s.replace(needle,'const branch=canonicalBranch(body.branch),pin=String(body.pin||"");')
          p.write_text(s)

          # Admin schedules: all original branches, title case only.
          rep('docs/admin-ui-overhaul.js',
              'const PO_BRANCHES=["ГОРНЯК","ЛОБОДЫ","НУРКЕН","САРАНЬ","ПРИШАХТИНСК"];',
              'const PO_BRANCHES=["Горняк","Лободы","Нуркена","Сарань","Пришахтинск","Ермекова","Анжерская"];')
          rep('docs/admin-ui-overhaul.js',
              'const PO_BRANCH_LABELS={"ГОРНЯК":"Горняк","ЛОБОДЫ":"Лободы","НУРКЕН":"Нуркен","НУРКЕНА":"Нуркен","САРАНЬ":"Сарань","ПРИШАХТИНСК":"Пришахтинск"};',
              'const PO_BRANCH_LABELS={"ГОРНЯК":"Горняк","ЛОБОДЫ":"Лободы","НУРКЕН":"Нуркена","НУРКЕНА":"Нуркена","САРАНЬ":"Сарань","ПРИШАХТИНСК":"Пришахтинск","ЕРМЕКОВА":"Ермекова","АНЖЕРСКАЯ":"Анжерская","АНЖЕРСКОГО":"Анжерская"};')
          rep('docs/admin-ui-overhaul.js',
              'const branchKey=value=>{const key=normalize(value);return key==="нуркена"?"нуркен":key};',
              'const branchKey=value=>{const key=normalize(value);return key==="нуркен"||key==="нуркена"?"нуркена":key};\n  const canonicalBranch=value=>PO_BRANCH_LABELS[String(value??"").trim().toLocaleUpperCase("ru-RU")]||String(value??"").trim();')
          rep('docs/admin-ui-overhaul.js',
              'const branch=card.querySelector(\'[data-key="branch"]\')?.value.trim()||"";',
              'const branch=canonicalBranch(card.querySelector(\'[data-key="branch"]\')?.value.trim()||"");')

          # Cache bust the corrected branch code.
          p=Path('docs/config.js'); s=p.read_text()
          s=re.sub(r'admin-ui-overhaul\.js\?v=[^"\']+', 'admin-ui-overhaul.js?v=20261016-5', s)
          s=re.sub(r'admin-offer-status-fix\.js\?v=[^"\']+', 'admin-offer-status-fix.js?v=20261016-3', s)
          s=re.sub(r'branch-display\.js\?v=[^"\']+', 'branch-display.js?v=20261016-4', s)
          p.write_text(s)
          PY
      - name: Commit restored code
        run: |
          git config user.name "Alexandr"
          git config user.email "blacknode305@gmail.com"
          git add server/server.js docs/admin-ui-overhaul.js docs/config.js docs/form.html docs/operator.html
          git diff --cached --check
          git commit -m "Restore all branches and normalize casing"
          git push
