<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRO OPTIMA · Форма производства</title><script src="config.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef3f5;color:#24313a}button,input,select{font:inherit}:root{--line:#d7e1e6;--muted:#71808a;--green:#4e9670}.app{max-width:760px;margin:auto;min-height:100vh;background:#fafcfd}.login{padding:18px}.loginbox{max-width:430px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 14px 45px #20313b14}.brand{font-size:18px;font-weight:850}.muted,.meta{font-size:11px;color:var(--muted);line-height:1.4}label{display:block;font-size:11px;font-weight:750;color:#53636c;margin:9px 0 5px}input,select{width:100%;min-height:40px;border:1px solid #c5d1d7;border-radius:9px;background:#fff;padding:8px 10px;color:#24313a}button{border:1px solid #c4d0d6;border-radius:9px;background:#f0f3f4;padding:8px 10px;font-weight:750;color:#33434c;cursor:pointer}.primary{background:var(--green);border-color:#3f835e;color:#fff}.full{width:100%}.msg{margin-top:8px;padding:8px;border-radius:8px;background:#fae7e7;color:#8b4444;font-size:12px}header{position:sticky;top:0;z-index:20;background:#fafcfdea;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px}.head{display:flex;justify-content:space-between;gap:8px}.online{font-size:10px;padding:5px 8px;border-radius:999px;background:#e7f3eb;color:#356d4b}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:9px}.tabs button.active{background:#26353e;color:#fff;border-color:#26353e}main{padding:10px}.view{display:none}.view.active{display:block}.summary{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.chip{font-size:10px;font-weight:800;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:14px;font-weight:850}.status{font-size:10px;font-weight:800;padding:5px 7px;border-radius:999px;background:#edf1f3;white-space:nowrap}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 10px;text-align:center;color:#78868e}.overlay{position:fixed;inset:0;background:#1726308a;z-index:70;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.modal{width:min(760px,100%);max-height:94vh;background:#fff;border-radius:17px 17px 0 0;display:flex;flex-direction:column}.mh{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}.mb{padding:10px 12px;overflow:auto}.mf{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}.notice{font-size:11px;color:#596a73;background:#f6f9fa;border:1px solid #dce4e8;border-radius:8px;padding:8px;margin-bottom:7px}.item-head,.item{display:grid;grid-template-columns:minmax(125px,1.5fr) 62px 58px 62px 58px;gap:4px;align-items:center}.item-head{font-size:9px;text-transform:uppercase;color:#7b8991;font-weight:800}.item{padding:6px 0;border-bottom:1px solid #e8edef}.item input,.item select{min-height:36px;padding:6px 4px;text-align:center;min-width:0}.item .p{text-align:left}.recv-head,.recv{display:grid;grid-template-columns:minmax(135px,1.4fr) 74px 66px 58px;gap:4px;align-items:center}.recv-head{font-size:9px;color:#7b8991;font-weight:800}.recv{padding:6px 0;border-bottom:1px solid #e8edef}.recv input,.recv select{min-height:36px;padding:6px 4px;text-align:center;min-width:0}@media(max-width:520px){.item-head,.item{grid-template-columns:minmax(105px,1.2fr) 50px 48px 50px 48px;gap:3px}.item input,.item select{font-size:12px;padding:5px 3px}.recv-head,.recv{grid-template-columns:minmax(110px,1.2fr) 60px 54px 50px;gap:3px}.recv input,.recv select{font-size:12px;padding:5px 3px}}@media(min-width:761px){.overlay{align-items:center;padding:20px}.modal{border-radius:15px;max-height:90vh}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brand">PRO OPTIMA · Производство</div><p class="muted">Сегодняшний список заявок и приёмка поставок по настройкам администратора.</p><label>Производство</label><select id="lb"><option>Лободы</option><option>Нуркена</option><option>Горняк</option><option>Пришахтинск</option><option>Сарань</option><option>Ермекова</option><option>Анжерская</option></select><label>PIN производства</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password"><button class="primary full" style="margin-top:11px" onclick="login()">Войти</button><div id="lm"></div></div></div>
<div id="app" class="app" style="display:none"><header><div class="head"><div><div class="brand">PRO OPTIMA · <span id="bn"></span></div><div id="tl" class="muted"></div></div><div><span id="on" class="online">...</span><button style="border:0;background:transparent;padding:4px" onclick="logout()">Сменить</button></div></div><div class="tabs"><button id="to" class="active" onclick="show('o')">Заявки сегодня</button><button id="tr" onclick="show('r')">Поставки сегодня</button></div></header><main><section id="vo" class="view active"><div id="so" class="summary"></div><div id="lo"></div></section><section id="vr" class="view"><div id="sr" class="summary"></div><div id="lr"></div></section></main></div>
<div id="ov" class="overlay" onclick="if(event.target===this)cm()"><div class="modal"><div class="mh"><b id="mt"></b><button onclick="cm()">×</button></div><div id="mb" class="mb"></div><div id="mf" class="mf"></div></div></div>
<script>
const CFG=window.PRO_OPTIMA_CONFIG||{},API=String(CFG.API_BASE||"").replace(/\/+$/,"");const TK="proOptimaOperatorToken_v1",BK="proOptimaOperatorBranch_v1";let token=localStorage.getItem(TK)||"",branch=localStorage.getItem(BK)||"",S=null;const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"),norm=s=>String(s??"").trim().toLocaleLowerCase("ru-RU");const UNIT_PRESETS=["шт", "кг", "г", "л", "мл", "м", "см", "мм", "м²", "м³", "т", "уп", "пач", "б", "бут", "бан", "кор", "ящ", "меш", "рул", "лист", "пара", "компл", "набор"];function unitOptions(v){v=String(v||"").trim();const a=[...UNIT_PRESETS];if(v&&!a.includes(v))a.unshift(v);return a.map(x=>`<option value="${esc(x)}" ${x===v?"selected":""}>${esc(x)}</option>`).join("")}
function fd(s){if(!s)return"—";let[y,m,d]=s.split("-");return`${d}.${m}.${y}`}
async function api(path,opts={}){const h={"Content-Type":"application/json",...(opts.headers||{})};if(token)h.Authorization="Bearer "+token;const r=await fetch(API+path,{...opts,headers:h});let x={};try{x=await r.json()}catch{}if(r.status===401&&path!=="/api/operator/login"){logout(false);throw Error(x.error||"Сеанс истёк")}if(!r.ok)throw Error(x.error||`HTTP ${r.status}`);return x}
async function login(){try{const x=await api("/api/operator/login",{method:"POST",body:JSON.stringify({branch:$("lb").value,pin:$("lp").value})});token=x.token;branch=x.branch;localStorage.setItem(TK,token);localStorage.setItem(BK,branch);$("lp").value="";await start()}catch(e){$("lm").innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
function logout(f=true){token="";branch="";S=null;localStorage.removeItem(TK);localStorage.removeItem(BK);$("app").style.display="none";$("login").style.display="block";if(f)$("lp").focus()}
async function start(){$("login").style.display="none";$("app").style.display="block";await load()}
async function load(){S=await api("/api/operator/bootstrap");branch=S.branch;localStorage.setItem(BK,branch);$("bn").textContent=branch;$("tl").textContent=`${S.dayName}, ${fd(S.today)}`;$("on").textContent=`rev ${S.revision}`;render()}
function show(x){$("vo").classList.toggle("active",x==="o");$("vr").classList.toggle("active",x==="r");$("to").classList.toggle("active",x==="o");$("tr").classList.toggle("active",x==="r")}
function of(r){return(S.orders||[]).find(o=>o.requestDate===r.requestDate&&((o.supplierId&&String(o.supplierId)===String(r.supplierId))||norm(o.supplier)===norm(r.supplier)))}
function render(){const rows=S.plan||[],sent=rows.filter(r=>of(r)?.stage==="sent").length,closed=rows.filter(r=>["confirmed","expected","done"].includes(of(r)?.stage)).length;$("so").innerHTML=`<span class="chip">Сегодня: ${rows.length}</span><span class="chip">Подано: ${sent}</span><span class="chip">Ожидается/закрыто: ${closed}</span>`;$("lo").innerHTML=rows.length?rows.map(r=>{const o=of(r),st=o?.stage||"new",txt={new:"Не заполнено",sent:"Заявка подана",confirmed:"Ожидается",expected:"Ожидается",done:"Принято"}[st]||st,lock=o&&["confirmed","expected","done"].includes(st);return`<div class="card"><div class="top"><div><div class="title">${esc(r.supplier)}</div><div class="meta">Поставка: <b>${fd(r.deliveryDate)}</b> · товаров: ${r.items.length}</div></div><span class="status">${txt}</span></div><div class="actions"><button class="primary" ${lock?"disabled":""} onclick="openOrder('${esc(r.supplierId)}')">${o?.stage==="sent"?"Исправить заявку":"Заполнить заявку"}</button></div></div>`}).join(""):'<div class="empty">На сегодня заявок по графику нет.</div>';const rec=(S.orders||[]).filter(o=>["confirmed","expected"].includes(o.stage)&&o.deliveryDate===S.today);$("sr").innerHTML=`<span class="chip">Поставки сегодня: ${rec.length}</span>`;$("lr").innerHTML=rec.length?rec.map(o=>`<div class="card"><div class="top"><div><div class="title">${esc(o.supplier)}</div><div class="meta">Подано ${fd(o.requestDate)} · позиций ${(o.items||[]).filter(x=>x.used!==false).length}</div></div><span class="status">Ожидается</span></div><div class="actions"><button class="primary" onclick="openReceive('${esc(o.id)}')">Заполнить приёмку</button></div></div>`).join(""):'<div class="empty">На сегодня подтверждённых поставок нет.</div>'}
function plan(id){return(S.plan||[]).find(x=>String(x.supplierId)===String(id))}function ord(id){return(S.orders||[]).find(x=>String(x.id)===String(id))}function om(t,b,f=""){$("mt").textContent=t;$("mb").innerHTML=b;$("mf").innerHTML=f;$("ov").classList.add("open")}function cm(){$("ov").classList.remove("open")}
function itemRow(p,x,i){return`<div class="item" data-i="${i}"><div class="p"><b>${esc(p.name)}</b><div class="muted">база: ${esc(p.unit||"—")}</div></div><input class="sq" inputmode="decimal" value="${esc(x.stock??"")}" placeholder="0"><select class="su">${unitOptions(x.stockUnit||p.unit||"")}</select><input class="oq" inputmode="decimal" value="${esc(x.expected??"")}" placeholder="0"><select class="ou">${unitOptions(x.unit||p.unit||"")}</select></div>`}
function openOrder(id){const r=plan(id);if(!r)return;const o=of(r),old=new Map((o?.items||[]).map(x=>[String(x.productId||x.product),x])),rows=r.items.map((p,i)=>itemRow(p,old.get(String(p.productId))||old.get(p.name)||{},i)).join("");om(r.supplier,`<div class="notice">Остаток и заказ имеют отдельные единицы измерения. «-» в остатке = товар не используется.</div><div class="item-head"><div>Товар</div><div>Ост.</div><div>Ед.</div><div>Заказ</div><div>Ед.</div></div>${rows}<div id="em"></div>`,`<button onclick="cm()">Отмена</button><button class="primary" onclick="saveOrder('${esc(id)}')">${o?.stage==="sent"?"Отправить исправление":"Подать заявку"}</button>`);$("mb").addEventListener("input",e=>{if(e.target.matches(".sq")){const row=e.target.closest(".item"),off=e.target.value.trim()==="-";row.querySelector(".oq").disabled=off;row.querySelector(".ou").disabled=off;if(off)row.querySelector(".oq").value="0"}})}
async function saveOrder(id){const r=plan(id),o=of(r),els=[...$("mb").querySelectorAll(".item[data-i]")],items=els.map((el,i)=>{const p=r.items[i],s=el.querySelector(".sq").value,off=s.trim()==="-";return{productId:p.productId,product:p.name,stock:s,stockUnit:el.querySelector(".su").value.trim()||p.unit||"",expected:off?0:el.querySelector(".oq").value,unit:el.querySelector(".ou").value.trim()||p.unit||"",used:!off,delivered:null,deliveredUnit:el.querySelector(".ou").value.trim()||p.unit||""}});try{await api("/api/operator/orders",{method:"POST",body:JSON.stringify({id:o?.id||undefined,supplierId:r.supplierId,requestDate:r.requestDate,deliveryDate:r.deliveryDate,items,stage:"sent",correction:!!o})});cm();await load()}catch(e){$("em").innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
function openReceive(id){const o=ord(id);if(!o)return;const used=(o.items||[]).filter(x=>x.used!==false),rows=used.map((x,i)=>`<div class="recv" data-i="${i}"><div><b>${esc(x.product)}</b><div class="muted">заказ: ${esc(x.expected??0)} ${esc(x.unit||"")}</div></div><div>${esc(x.confirmed??x.expected??0)} ${esc(x.unit||"")}</div><input class="dq" inputmode="decimal" value="${esc(x.delivered??x.confirmed??x.expected??0)}"><select class="du">${unitOptions(x.deliveredUnit||x.unit||"")}</select></div>`).join("");om("Приёмка · "+o.supplier,`<div class="notice">Фактическое количество и единицу можно изменить перед приёмкой.</div><div class="recv-head"><div>Товар</div><div>Ожид.</div><div>Пришло</div><div>Ед.</div></div>${rows}<div id="em"></div>`,`<button onclick="cm()">Отмена</button><button class="primary" onclick="saveReceive('${esc(id)}')">Поставка принята</button>`)}
async function saveReceive(id){const o=ord(id),els=[...$("mb").querySelectorAll(".recv[data-i]")];let k=0;const items=(o.items||[]).map(x=>{if(x.used===false)return x;const e=els[k++];return{...x,delivered:e.querySelector(".dq").value,deliveredUnit:e.querySelector(".du").value.trim()||x.unit}});try{await api("/api/operator/orders/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({stage:"done",items})});cm();await load()}catch(e){$("em").innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
window.PRO_OPTIMA_REFRESH=load;
if(token&&branch)start();
</script></body></html>
