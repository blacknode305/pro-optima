<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRO OPTIMA · Заявки</title>
<script src="config.js?v=20261016-restore1"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef3f5;color:#24313a}button,input,select{font:inherit}:root{--line:#d6e0e5;--muted:#70808a;--green:#4d9570;--blue:#47789d;--amber:#c58b3c;--red:#b65f5f}.app{max-width:820px;margin:auto;min-height:100vh;background:#f9fbfc}.login{padding:18px}.loginbox{max-width:430px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 14px 45px #20313b14}.brand{font-size:18px;font-weight:850}.muted,.meta{font-size:11px;color:var(--muted);line-height:1.4}label{display:block;font-size:11px;font-weight:750;color:#53636c;margin:9px 0 5px}input,select{width:100%;min-height:40px;border:1px solid #c5d1d7;border-radius:9px;background:#fff;padding:8px 10px;color:#24313a}button{border:1px solid #c4d0d6;border-radius:9px;background:#f0f3f4;padding:8px 10px;font-weight:750;color:#33434c;cursor:pointer}button:disabled{opacity:.5}.primary{background:var(--green);border-color:#3f835e;color:#fff}.blue{background:var(--blue);border-color:#3b6888;color:#fff}.danger{background:#f7e7e7;border-color:#dbbaba;color:#804747}.warn{background:#fff1da;border-color:#dfbd80;color:#7e5b23}.full{width:100%}.msg{margin-top:8px;padding:8px 9px;border-radius:8px;font-size:12px}.msg.err{background:#fae7e7;color:#8b4444}.msg.ok{background:#e6f4ea;color:#326b49}header{position:sticky;top:0;z-index:25;background:#f9fbfcea;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.head-actions{display:flex;gap:5px;align-items:center}.online{font-size:10px;padding:5px 8px;border-radius:999px;background:#e6f3ea;color:#346c4a}.icon{padding:6px 8px}.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-top:9px}.search{grid-column:1/-1}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.tabs button.active{background:#26353e;color:#fff;border-color:#26353e}main{padding:10px}.summary{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.chip{font-size:10px;font-weight:800;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff}.card{background:#fff;border:1px solid var(--line);border-left:4px solid #a7b4ba;border-radius:12px;padding:11px;margin-bottom:8px}.card.received{border-left-color:var(--amber)}.card.sent{border-left-color:var(--blue)}.card.confirmed,.card.expected{border-left-color:var(--green)}.card.done{border-left-color:#929ea4}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:14px;font-weight:850}.status{font-size:10px;font-weight:800;padding:5px 7px;border-radius:999px;background:#edf1f3;white-space:nowrap}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.actions button{padding:7px 8px;font-size:11px}.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 10px;text-align:center;color:#78868e}.overlay{position:fixed;inset:0;background:#1726308a;z-index:80;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.modal{width:min(820px,100%);max-height:94vh;background:#fff;border-radius:17px 17px 0 0;display:flex;flex-direction:column}.mh{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}.mb{padding:10px 12px;overflow:auto}.mf{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.notice{font-size:11px;color:#596a73;background:#f6f9fa;border:1px solid #dce4e8;border-radius:8px;padding:8px;margin-bottom:7px}.edit-head,.edit-row{display:grid;grid-template-columns:minmax(135px,1.6fr) 70px 66px 70px 66px 34px;gap:5px;align-items:center}.edit-head{font-size:9px;text-transform:uppercase;color:#7b8991;font-weight:800;padding:3px 0}.edit-row{padding:6px 0;border-bottom:1px solid #e8edef}.edit-row input,.edit-row select{min-height:36px;padding:6px 5px;text-align:center;min-width:0}.edit-row .p{text-align:left}.receive-head,.receive-row{display:grid;grid-template-columns:minmax(140px,1.5fr) 78px 72px 68px 34px;gap:5px;align-items:center}.receive-head{font-size:9px;color:#7b8991;font-weight:800}.receive-row{padding:6px 0;border-bottom:1px solid #e8edef}.receive-row input,.receive-row select{min-height:36px;padding:6px 5px;text-align:center;min-width:0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:#24313a;color:#fff;padding:9px 12px;border-radius:10px;font-size:12px;box-shadow:0 8px 30px #0004;display:none}.toast.show{display:block}@media(max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters .branch{grid-column:1/-1}.brand{font-size:16px}.edit-head,.edit-row{grid-template-columns:minmax(115px,1.2fr) 54px 54px 54px 54px 30px;gap:3px}.edit-row input,.edit-row select{font-size:12px;padding:5px 3px}.receive-head,.receive-row{grid-template-columns:minmax(120px,1.3fr) 62px 58px 54px 30px;gap:3px}.receive-row input,.receive-row select{font-size:12px;padding:5px 3px}}@media(min-width:821px){.overlay{align-items:center;padding:20px}.modal{border-radius:15px;max-height:90vh}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="brand">PRO OPTIMA · Заявки</div><p class="muted">Мобильная версия для сменщицы: все филиалы, редактирование заявок, WhatsApp поставщику, подтверждение отгрузки и приёмка.</p><label>Ключ доступа</label><input id="access" type="password" autocomplete="current-password" placeholder="Введите ключ"><button class="primary full" style="margin-top:11px" onclick="login()">Войти</button><div id="loginMsg"></div></div></div>
<div id="app" class="app" style="display:none"><header><div class="head"><div><div class="brand">PRO OPTIMA · Заявки</div><div id="rev" class="muted"></div></div><div class="head-actions"><span id="online" class="online">...</span><button class="icon" onclick="load()">↻</button><button class="icon" onclick="logout()">×</button></div></div><div class="filters"><div class="branch"><label>Филиал</label><select id="branch" onchange="render()"><option value="">Все филиалы</option></select></div><div><label>Статус</label><select id="status" onchange="render()"><option value="active">Активные</option><option value="">Все</option><option value="received">Получена</option><option value="sent">Ждёт подтверждения</option><option value="confirmed">Ожидается</option><option value="done">Исполнено</option></select></div><div><label>Дата</label><input id="date" type="date" onchange="render()"></div><div class="search"><label>Поиск</label><input id="search" type="search" placeholder="Поставщик, товар, филиал" oninput="render()"></div></div><div class="tabs"><button id="ta" class="active" onclick="tab('a')">Активные</button><button id="td" onclick="tab('d')">Поставки сегодня</button><button id="th" onclick="tab('h')">История</button></div></header><main><div id="summary" class="summary"></div><div id="list"></div></main></div>
<div id="ov" class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mh"><b id="mt"></b><button onclick="closeModal()">×</button></div><div id="mb" class="mb"></div><div id="mf" class="mf"></div></div></div><div id="toast" class="toast"></div>
<script>
const CFG=window.PRO_OPTIMA_CONFIG||{},API=String(CFG.API_BASE||"").replace(/\/+$/,"");
const KEY="proOptimaDispatcherToken_v1",ADMIN_KEY="proOptimaAdminToken_v1";let token=localStorage.getItem(KEY)||localStorage.getItem(ADMIN_KEY)||"",DB=null,revision=null,currentTab="a";
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");const norm=s=>String(s??"").trim().toLocaleLowerCase("ru-RU");const isoToday=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Almaty",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const UNIT_PRESETS=["шт", "кг", "г", "л", "мл", "м", "см", "мм", "м²", "м³", "т", "уп", "пач", "б", "бут", "бан", "кор", "ящ", "меш", "рул", "лист", "пара", "компл", "набор"];function unitOptions(v){v=String(v||"").trim();const a=[...UNIT_PRESETS];if(v&&!a.includes(v))a.unshift(v);return a.map(x=>`<option value="${esc(x)}" ${x===v?"selected":""}>${esc(x)}</option>`).join("")}
function fd(v){if(!v)return"—";const[y,m,d]=String(v).split("-");return `${d}.${m}.${y}`}
function toast(text){const e=$("toast");e.textContent=text;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2300)}
async function req(path,opts={}){const h={"Content-Type":"application/json",...(opts.headers||{})};if(token)h.Authorization="Bearer "+token;const r=await fetch(API+path,{...opts,headers:h});let x={};try{x=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(x.error||`HTTP ${r.status}`),{status:r.status});return x}
async function login(){token=$("access").value.trim();if(!token)return;try{await req("/api/admin/db");localStorage.setItem(KEY,token);$("loginMsg").innerHTML="";await start()}catch(e){token="";$("loginMsg").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}
function logout(){localStorage.removeItem(KEY);token="";DB=null;$("app").style.display="none";$("login").style.display="block";$("access").value=""}
async function start(){$("login").style.display="none";$("app").style.display="block";await load()}
async function load(){try{const out=await req("/api/admin/db");DB=out.data||{};revision=out.revision;$("rev").textContent=`Общая база · revision ${revision}`;$("online").textContent="онлайн";fillBranches();render()}catch(e){$("online").textContent="ошибка";if(e.status===401)logout();else toast(e.message)}}
function branches(){const s=new Set();(DB?.history||[]).forEach(x=>x.branch&&s.add(x.branch));(DB?.suppliers||[]).forEach(x=>(x.schedules||[]).forEach(r=>r.branch&&s.add(r.branch)));return[...s].sort((a,b)=>a.localeCompare(b,"ru"))}
function fillBranches(){const el=$("branch"),cur=el.value;el.innerHTML='<option value="">Все филиалы</option>'+branches().map(x=>`<option>${esc(x)}</option>`).join("");if([...el.options].some(o=>o.value===cur))el.value=cur}
function stage(o){return String(o.stage||"received")}function stageText(o){return{received:"Получена",sent:"Ждёт подтверждения",confirmed:"Ожидается",expected:"Ожидается",done:"Исполнено",cancelled:"Отменено"}[stage(o)]||stage(o)}
function rows(){const b=$("branch").value,st=$("status").value,date=$("date").value,q=norm($("search").value),today=isoToday();let arr=[...(DB?.history||[])];if(b)arr=arr.filter(x=>norm(x.branch)===norm(b));if(st==="active")arr=arr.filter(x=>!["done","cancelled"].includes(stage(x)));else if(st)arr=arr.filter(x=>stage(x)===st||(st==="confirmed"&&stage(x)==="expected"));if(date)arr=arr.filter(x=>x.requestDate===date||x.deliveryDate===date);if(currentTab==="d")arr=arr.filter(x=>["confirmed","expected"].includes(stage(x))&&x.deliveryDate===today);if(currentTab==="h")arr=arr.filter(x=>stage(x)==="done");if(currentTab==="a")arr=arr.filter(x=>stage(x)!=="done"&&stage(x)!=="cancelled");if(q)arr=arr.filter(x=>[x.branch,x.supplier,...(x.items||[]).map(i=>i.product)].some(v=>norm(v).includes(q)));return arr.sort((a,b)=>String(b.requestDate||"").localeCompare(String(a.requestDate||""))||String(b.createdAt||"").localeCompare(String(a.createdAt||"")))}
function tab(x){currentTab=x;for(const n of["a","d","h"])$("t"+n).classList.toggle("active",n===x);if(x==="a")$("status").value="active";if(x==="d")$("status").value="";if(x==="h")$("status").value="done";render()}
function render(){if(!DB)return;const all=DB.history||[],today=isoToday(),r=rows(),active=all.filter(x=>["received","sent","confirmed","expected"].includes(stage(x))).length,del=all.filter(x=>["confirmed","expected"].includes(stage(x))&&x.deliveryDate===today).length;$("summary").innerHTML=`<span class="chip">Показано: ${r.length}</span><span class="chip">Активных: ${active}</span><span class="chip">Поставки сегодня: ${del}</span>`;$("list").innerHTML=r.length?r.map(card).join(""):'<div class="empty">Заявок по выбранным условиям нет.</div>'}
function card(o){const st=stage(o),n=(o.items||[]).filter(x=>x.used!==false&&Number(x.expected??0)>0).length;let acts=`<button onclick="openEdit('${esc(o.id)}')">Редактировать</button><button onclick="copyOrder('${esc(o.id)}')">Копировать заявку</button>`;if(st==="received")acts+=`<button class="primary" onclick="sendSupplier('${esc(o.id)}')">WhatsApp поставщику</button>`;if(st==="sent")acts+=`<button onclick="sendSupplier('${esc(o.id)}')">Повторить WhatsApp</button><button class="primary" onclick="openConfirm('${esc(o.id)}')">Подтвердить отгрузку</button>`;if(["confirmed","expected"].includes(st))acts+=`<button class="primary" onclick="openReceive('${esc(o.id)}')">Принять поставку</button>`;return`<div class="card ${st}"><div class="top"><div><div class="title">${esc(o.branch)} · ${esc(o.supplier)}</div><div class="meta">Заявка ${fd(o.requestDate)} → поставка ${fd(o.deliveryDate)} · ${n} поз.</div></div><span class="status">${esc(stageText(o))}</span></div><div class="actions">${acts}</div></div>`}
function order(id){return(DB?.history||[]).find(x=>String(x.id)===String(id))}
function supplierByName(name){const n=norm(name);return(DB?.suppliers||[]).find(s=>norm(s.name)===n)||(DB?.suppliers||[]).find(s=>norm(s.name).includes(n)||n.includes(norm(s.name)))||null}
function phone(v){let d=String(v||"").replace(/\D/g,"");if(d.length===11&&d[0]==="8")d="7"+d.slice(1);if(d.length===10)d="7"+d;return d}
function orderText(o){const lines=[`${o.requestDate||isoToday()} — ${o.branch} — ${o.supplier}`,`Поставка: ${o.deliveryDate||"по графику"}`,""];(o.items||[]).filter(x=>x.used!==false&&Number(x.expected)>0).forEach(x=>lines.push(`${x.product} — ${String(x.expected).replace(".",",")} ${x.unit||""}`.trim()));lines.push("","Подтвердите наличие товара, пожалуйста.");return lines.join("\n")}
async function copyOrder(id){const o=order(id);if(!o)return;const ok=await clip(orderText(o));toast(ok?"Текст заявки скопирован":"Не удалось скопировать текст")}
async function clip(text){try{await navigator.clipboard.writeText(text);return true}catch{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch{}t.remove();return ok}}
function openModal(t,b,f=""){$("mt").textContent=t;$("mb").innerHTML=b;$("mf").innerHTML=f;$("ov").classList.add("open")}function closeModal(){$("ov").classList.remove("open")}
function num(v){const n=Number(String(v??"").replace(",","."));return Number.isFinite(n)?n:0}
function editRow(x,i){return`<div class="edit-row" data-i="${i}"><input class="p" value="${esc(x.product||"")}"><input class="sq" inputmode="decimal" value="${esc(x.stock??0)}"><select class="su">${unitOptions(x.stockUnit||x.unit||"")}</select><input class="oq" inputmode="decimal" value="${esc(x.expected??0)}"><select class="ou">${unitOptions(x.unit||"")}</select><button class="danger" onclick="this.closest('.edit-row').remove()">×</button></div>`}
function openEdit(id){const o=order(id);if(!o)return;const rows=(o.items||[]).map(editRow).join("");openModal(`Редактирование · ${o.branch} · ${o.supplier}`,`<div class="notice">Единица остатка и единица заказа меняются независимо. После сохранения текст для WhatsApp поставщику автоматически копируется.</div><div class="edit-head"><div>Товар</div><div>Ост.</div><div>Ед.</div><div>Заказ</div><div>Ед.</div><div></div></div><div id="editRows">${rows}</div><button style="margin-top:7px" onclick="addEditRow()">＋ Позиция</button><div id="em"></div>`,`<button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveEdit('${esc(id)}')">Сохранить и копировать</button>`)}
function addEditRow(){const w=$("editRows"),i=w.children.length;w.insertAdjacentHTML("beforeend",editRow({product:"",stock:0,stockUnit:"",expected:0,unit:""},i))}
async function mutate(id,fn){const fresh=await req("/api/admin/db"),data=fresh.data||{},history=structuredClone(data.history||[]),i=history.findIndex(x=>String(x.id)===String(id));if(i<0)throw Error("Заявка уже не найдена. Обновите список.");const extra=fn(history[i],data)||{};const changes={history,...extra};await req("/api/admin/db",{method:"PATCH",body:JSON.stringify({baseRevision:fresh.revision,changes})});await load();return order(id)}
async function saveEdit(id){const els=[...$("editRows").querySelectorAll(".edit-row")],items=els.map(el=>({product:el.querySelector(".p").value.trim(),used:true,stock:el.querySelector(".sq").value.trim()==="-"?"-":num(el.querySelector(".sq").value),stockUnit:el.querySelector(".su").value.trim(),expected:num(el.querySelector(".oq").value),unit:el.querySelector(".ou").value.trim(),delivered:null,deliveredUnit:el.querySelector(".ou").value.trim()})).filter(x=>x.product);try{const updated=await mutate(id,o=>{const old=new Map((o.items||[]).map(x=>[norm(x.product),x]));o.items=items.map(x=>({...old.get(norm(x.product)),...x,confirmed:old.get(norm(x.product))?.confirmed,delivered:old.get(norm(x.product))?.delivered,deliveredUnit:old.get(norm(x.product))?.deliveredUnit||x.unit}));o.updatedAt=new Date().toISOString()});closeModal();const ok=await clip(orderText(updated));toast(ok?"Сохранено. Текст WhatsApp скопирован":"Сохранено") }catch(e){$("em").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}
async function sendSupplier(id){const o=order(id);if(!o)return;const text=orderText(o),s=supplierByName(o.supplier),p=phone(s?.phone);try{await mutate(id,r=>{if((r.stage||"received")==="received")r.stage="sent";r.sentAt=r.sentAt||new Date().toISOString()});if(p)window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,"_blank");else{await clip(text);toast("Телефон поставщика не указан. Текст скопирован")}}catch(e){toast(e.message)}}
function openConfirm(id){const o=order(id);if(!o)return;const used=(o.items||[]).filter(x=>x.used!==false&&Number(x.expected)>0),rows=used.map((x,i)=>`<div class="receive-row" data-i="${i}"><div>${esc(x.product)}</div><div>${esc(x.expected)} ${esc(x.unit||"")}</div><input class="cq" inputmode="decimal" value="${esc(x.confirmed??x.expected)}"><select class="cu">${unitOptions(x.unit||"")}</select><div></div></div>`).join("");openModal(`Отгрузка · ${o.supplier}`,`<div class="notice">Исправьте количество и единицу только если поставщик подтвердил иначе.</div><div class="receive-head"><div>Товар</div><div>Заказ</div><div>Отгр.</div><div>Ед.</div><div></div></div><div id="confirmRows">${rows}</div><div id="em"></div>`,`<button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveConfirm('${esc(id)}')">Подтвердить отгрузку</button>`)}
async function saveConfirm(id){const els=[...$("confirmRows").querySelectorAll(".receive-row")];try{await mutate(id,o=>{let k=0;o.items=(o.items||[]).map(x=>{if(x.used===false||Number(x.expected)<=0)return x;const e=els[k++];return{...x,confirmed:num(e.querySelector(".cq").value),unit:e.querySelector(".cu").value.trim()||x.unit}});o.stage="confirmed";o.confirmedAt=new Date().toISOString();o.updatedAt=new Date().toISOString()});closeModal();toast("Отгрузка подтверждена")}catch(e){$("em").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}
function openReceive(id){const o=order(id);if(!o)return;const used=(o.items||[]).filter(x=>x.used!==false),rows=used.map((x,i)=>`<div class="receive-row" data-i="${i}"><div>${esc(x.product)}</div><div>${esc(x.confirmed??x.expected??0)} ${esc(x.unit||"")}</div><input class="dq" inputmode="decimal" value="${esc(x.delivered??x.confirmed??x.expected??0)}"><select class="du">${unitOptions(x.deliveredUnit||x.unit||"")}</select><div></div></div>`).join("");openModal(`Приёмка · ${o.branch} · ${o.supplier}`,`<div class="receive-head"><div>Товар</div><div>Ожид.</div><div>Пришло</div><div>Ед.</div><div></div></div><div id="receiveRows">${rows}</div><div id="em"></div>`,`<button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveReceive('${esc(id)}')">Поставка принята</button>`)}
function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
async function saveReceive(id){const els=[...$("receiveRows").querySelectorAll(".receive-row")];try{await mutate(id,(o,data)=>{let k=0;o.items=(o.items||[]).map(x=>{if(x.used===false)return x;const e=els[k++];return{...x,delivered:num(e.querySelector(".dq").value),deliveredUnit:e.querySelector(".du").value.trim()||x.unit}});o.stage="done";o.receivedAt=new Date().toISOString();o.updatedAt=new Date().toISOString();let stocks=(data.stocks||[]).filter(x=>String(x.sourceOrderId||"")!==String(o.id));for(const item of o.items){if(item.used===false||item.delivered===null||item.delivered===undefined)continue;stocks.push({id:uid("stock"),branch:o.branch,productId:Number(item.productId)||null,date:isoToday(),value:item.delivered,unit:item.deliveredUnit||item.unit||"",sourceSupplier:o.supplier,sourceOrderId:o.id,createdAt:new Date().toISOString()})}return{stocks}});closeModal();toast("Поставка принята") }catch(e){$("em").innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}
window.PRO_OPTIMA_REFRESH=load;
if(token){$("access").value=token;start()}
</script>
</body></html>
